# Goot Terminal Configuration (~/.config/goot/goot.ini)
# See `man goot.ini` for full documentation.

[main]
font = monospace
size = 11
line-spacing = 0
pad = 8
title = Goot

[window]
initial-cols = 100
initial-rows = 30

[scrollback]
lines = 4000

[cursor]
# block, underline, or beam
style = block

[touch]
# Hold duration (ms) before touch-drag switches from scrolling to selection
long-press-delay = 400

[url]
label-letters = sadfjklewcmpgh

[security]
# OSC 52 clipboard write is disabled by default
allow-osc52 = false

[colors]
background = #080808
foreground = #EAEAEA
cursor = #EAEAEA
selection-background = #2A3F5F
selection-foreground = #FFFFFF

regular0 = #181818
regular1 = #D75F5F
regular2 = #87AF87
regular3 = #D7AF87
regular4 = #5F87AF
regular5 = #AF87AF
regular6 = #5FAFAF
regular7 = #D0D0D0

bright0 = #585858
bright1 = #FF5F5F
bright2 = #AFDF87
bright3 = #FFD787
bright4 = #87AFFF
bright5 = #D7AFFF
bright6 = #87DFDF
bright7 = #FFFFFF

[key-bindings]
# Default Normal-mode shortcuts:
# scrollback-up-half-page = Shift+Page_Up
# scrollback-down-half-page = Shift+Page_Down
# clipboard-copy = Control+Shift+c XF86Copy
# clipboard-paste = Control+Shift+v XF86Paste
# primary-paste = Shift+Insert
# search-start = Control+Shift+r
# font-increase = Control+plus Control+equal
# font-decrease = Control+minus
# font-reset = Control+0
# spawn-terminal = Control+Shift+n
# show-urls-launch = Control+Shift+o
# unicode-input = Control+Shift+u
# prompt-prev = Control+Shift+z
# prompt-next = Control+Shift+x

[search-bindings]
# cancel = Control+g Escape
# commit = Return
# find-prev = Control+r
# find-next = Control+s
# extend-to-word-boundary = Control+w
# extend-to-next-whitespace = Control+Shift+w
# clipboard-paste = Control+v Control+Shift+v Control+y XF86Paste
# primary-paste = Shift+Insert

[url-bindings]
# cancel = Control+g Control+c Control+d Escape
# toggle-url-visible = t
